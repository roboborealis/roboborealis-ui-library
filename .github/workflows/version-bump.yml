name: Version bump

# Gate: every PR to main must bump the version in package.json. This is a pure check —
# it never writes to the branch (writing from CI spawns action_required re-runs and
# fights branch protection). Bump locally with `npm run bump` before pushing.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-bump:
    name: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version bump
        run: |
          git fetch origin main --depth=1
          MAIN_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          PR_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "ERROR: package.json version must be bumped before merging to main."
            echo "  main: $MAIN_VERSION | PR: $PR_VERSION"
            echo "Run: npm run bump         (patch)"
            echo "     npm run bump:minor   or   npm run bump:major"
            echo "Then commit package.json + package-lock.json and push."
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$PR_VERSION" ]; then
            echo "ERROR: package-lock.json version ($LOCK_VERSION) != package.json ($PR_VERSION)."
            echo "Run 'npm run bump' (it updates both) and commit the result."
            exit 1
          fi
          echo "Version OK: $MAIN_VERSION -> $PR_VERSION (lock matches)."
