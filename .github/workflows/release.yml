name: Release

# On merge to main, tag the version in package.json and cut a GitHub Release with
# auto-generated notes. No CHANGELOG file is committed — notes live on the Release page.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release if version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          # gh creates the tag at the target commit and the release together,
          # so no git identity or manual tag push is needed on the runner.
          gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          echo "Created release $TAG"
